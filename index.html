<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wifecountdown</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #efa4f0;
        color: #fff;
        font-family: Arial, sans-serif;
        position: relative; /* Needed to anchor absolute positions */
        overflow: hidden;   /* Keeps edge images from creating scrollbars */
    }

    /* The wrapper is now perfectly centered because rac2 is taken out of the layout flow */
    .timer-wrapper {
        position: relative;
        display: flex;
        flex-direction: column; /* Stacks timer and percentage */
        align-items: center;
    }

    #timer {
        font-size: 4rem;
        font-weight: bold;
        text-align: center;
        font-variant-numeric: tabular-nums; /* Keeps numbers from wiggling horizontally */
    }

    #percentage {
        font-size: 1.5rem;
        margin-top: 5px;
        opacity: 0.9;
        font-family: monospace; /* Monospace keeps the 8 decimal places stable */
    }

    /* Image 1: Faint at bottom left */
    .rac1 {
        position: absolute;
        bottom: 25px;
        left: 25px;
        width: 560px;
        opacity: 0.5;
        pointer-events: none;
    }

    /* Image 2: Anchored absolutely to the right of the timer */
    .rac2 {
        position: absolute;
        left: 100%; /* Pushes it exactly outside the right edge of the timer */
        margin-left: 30px; /* Space between timer and rac2 */
        top: 50%;
        transform: translateY(-50%); /* Centers it vertically alongside the text */
        width: 256px;
        height: auto;
        opacity: 0.5;
    }

    /* Image 3: Top screen near left/middle */
    .rac3 {
        position: absolute;
        top: 20px;
        left: 25%;
        width: 480px;
        opacity: 0.5;
        pointer-events: none;
    }
</style>
</head>
<body>

<!-- Top left/middle image -->
<img src="rac3.png" alt="rac3" class="rac3">

<!-- Centered timer with rac2 to its right -->
<div class="timer-wrapper">
    <div id="timer">Loading...</div>
    <div id="percentage">0.00000000%</div>
    <img src="rac2.png" alt="rac2" class="rac2">
</div>

<!-- Faint bottom-left image -->
<img src="rac1.png" alt="rac1" class="rac1">

<script>
    // Set your target end date
    const endTime = new Date("2026-08-16T20:00:00Z").getTime();
    
    // Set a start date to calculate the percentage from. 
    // CHANGE THIS to the exact date/time you started the countdown!
    // Right now it's set to January 1, 2026 as a placeholder.
    const startTime = new Date("2026-01-01T00:00:00Z").getTime(); 

    function updateTimer() {
        const now = Date.now();
        let diff = endTime - now;

        // If the countdown is over
        if (diff <= 0) {
            document.getElementById("timer").textContent = "000:00:00";
            document.getElementById("percentage").textContent = "100.00000000%";
            return;
        }

        // --- Time Math ---
        const totalSeconds = Math.floor(diff / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        document.getElementById("timer").textContent =
            String(hours).padStart(3, "0") + ":" +
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        // --- Percentage Math ---
        const totalDuration = endTime - startTime;
        const elapsed = now - startTime;
        let percent = (elapsed / totalDuration) * 100;

        // Cap the percentage so it doesn't drop below 0 if you view it before the start date
        if (percent < 0) percent = 0;
        if (percent > 100) percent = 100;

        // .toFixed(8) forces exactly 8 decimal places
        document.getElementById("percentage").textContent = percent.toFixed(8) + "%";
    }

    updateTimer();
    
    // Run every 50 milliseconds instead of 1000 so the 8 decimals look super smooth!
    setInterval(updateTimer, 50);
</script>

</body>
</html>
