<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wifecountdown</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #efa4f0;
        color: #fff;
        font-family: Arial, sans-serif;
        position: relative; /* Needed to anchor absolute positions */
        overflow: hidden;   /* Keeps edge images from creating scrollbars */
    }

    /* Group timer and rac2 together side-by-side */
    .timer-wrapper {
        display: flex;
        align-items: center;
        gap: 30px; /* Space between timer and rac2 */
    }

    #timer {
        font-size: 4rem;
        font-weight: bold;
        text-align: center;
    }

    /* Image 1: Faint at bottom left */
    .rac1 {
        position: absolute;
        bottom: 25px;
        left: 25px;
        width: 140px;      /* Adjust size if needed */
        opacity: 0.5;     /* Makes it faint (35% visible) */
        pointer-events: none;
    }

    /* Image 2: Right of the timer */
    .rac2 {
        width: 100px;      /* Adjust size if needed */
        height: auto;
        opacity: 0.5;
    }

    /* Image 3: Top screen near left/middle */
    .rac3 {
        position: absolute;
        top: 20px;
        left: 25%;         /* Positioned between left (0%) and center (50%) */
        width: 120px;
        opacity: 0.5;
        /* Adjust size if needed */
        pointer-events: none;
    }
</style>
</head>
<body>

<!-- Top left/middle image -->
<img src="rac3.png" alt="rac3" class="rac3">

<!-- Centered timer with rac2 to its right -->
<div class="timer-wrapper">
    <div id="timer">Loading...</div>
    <img src="rac2.png" alt="rac2" class="rac2">
</div>

<!-- Faint bottom-left image -->
<img src="rac1.png" alt="rac1" class="rac1">

<script>
    const endTime = new Date("2026-08-16T20:00:00Z").getTime();

    function updateTimer() {
        const now = Date.now();
        let diff = endTime - now;

        if (diff <= 0) {
            document.getElementById("timer").textContent = "000:00:00";
            return;
        }

        const totalSeconds = Math.floor(diff / 1000);

        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        document.getElementById("timer").textContent =
            String(hours).padStart(3, "0") + ":" +
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");
    }

    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
